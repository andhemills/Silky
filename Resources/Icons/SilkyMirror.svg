<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   version="1.1"
   viewBox="0 0 64 64"
   id="svg8"
   sodipodi:docname="SilkyMirror.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   inkscape:export-filename="SilkyMirror.png"
   inkscape:export-xdpi="96"
   inkscape:export-ydpi="96"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs8" />
  <sodipodi:namedview
     id="namedview8"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="5.4248348"
     inkscape:cx="28.940973"
     inkscape:cy="37.512663"
     inkscape:window-width="1080"
     inkscape:window-height="1849"
     inkscape:window-x="3832"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg8" />
  <!-- Silky Mirror icon
       A control polygon (left) reflected across a vertical YZ mirror plane
       (dashed center line) to its mirror image (right). Cyan legs and blue
       control points follow the Silky ControlPoly colour convention
       (lines 0,1,1 ; points 0,0,1). -->
  <!-- mirror plane: dashed vertical line -->
  <line
     x1="30.893976"
     y1="4"
     x2="30.893976"
     y2="60"
     stroke="#ff5500"
     stroke-width="2"
     stroke-dasharray="4, 3"
     stroke-linecap="round"
     id="line1"
     style="stroke-dasharray:8,8;stroke-dashoffset:0;stroke-width:4" />
  <!-- LEFT control polygon (the source) -->
  <g
     id="g9"
     transform="translate(-4.2397604)">
    <polyline
       points="10,50 14,24 24,14 28,40"
       fill="none"
       stroke="#00aaff"
       stroke-width="2.5"
       stroke-linejoin="round"
       stroke-linecap="round"
       id="polyline1" />
    <g
       fill="#0033ff"
       id="g4">
      <circle
         cx="10"
         cy="50"
         r="3.2"
         id="circle1" />
      <circle
         cx="14"
         cy="24"
         r="3.2"
         id="circle2" />
      <circle
         cx="24"
         cy="14"
         r="3.2"
         id="circle3" />
      <circle
         cx="28"
         cy="40"
         r="3.2"
         id="circle4" />
    </g>
  </g>
  <!-- RIGHT control polygon (the mirror image: x reflected about x=32) -->
  <g
     id="g10"
     transform="translate(4.2397604)">
    <polyline
       points="54,50 50,24 40,14 36,40"
       fill="none"
       stroke="#00d4ff"
       stroke-width="2.5"
       stroke-linejoin="round"
       stroke-linecap="round"
       opacity="0.95"
       id="polyline4" />
    <g
       fill="#3358ff"
       id="g8">
      <circle
         cx="54"
         cy="50"
         r="3.2"
         id="circle5" />
      <circle
         cx="50"
         cy="24"
         r="3.2"
         id="circle6" />
      <circle
         cx="40"
         cy="14"
         r="3.2"
         id="circle7" />
      <circle
         cx="36"
         cy="40"
         r="3.2"
         id="circle8" />
    </g>
  </g>
</svg>
